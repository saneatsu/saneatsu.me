name: ⚡️ Vitest

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ルートのvitest workspace設定でテストを一括実行（カバレッジ含む）
      - name: Run Vitest tests with coverage
        run: pnpm vitest --coverage.enabled=true

      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2

      # ミドルウェアテストはメインのVitestから除外されているため個別に実行する。
      # (別環境・別setupが必要。理由の詳細は vitest.config.middleware.mts を参照)
      - name: Run middleware tests
        run: pnpm --filter @saneatsu/frontend test:middleware
